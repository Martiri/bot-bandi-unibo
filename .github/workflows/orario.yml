name: Controllo Bandi UniBo

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

# Questo blocco DÀ IL PERMESSO al bot di modificare i file e creare Issues
permissions:
  contents: write
  issues: write

jobs:
  avvia_bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del codice
      uses: actions/checkout@v4

    - name: Setup di Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Installa le librerie necessarie
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 PyPDF2

    - name: Esegui lo script Python
      env:
        # Passiamo al codice Python il Token di sistema automatico di GitHub
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: python bandi.py

    - name: Salva i nuovi bandi nel repository
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action Bot"
        git add bandi_trovati.json
        git commit -m "Aggiornamento memoria bandi trovati" || echo "Nessun nuovo bando da salvare"
        git push
