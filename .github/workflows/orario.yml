name: Controllo Bandi UniBo

on:
  schedule:
    # Esegue lo script ogni giorno alle 08:00 UTC (che sono le 10:00 in Italia con l'ora legale)
    - cron: '0 8 * * *'
  workflow_dispatch: # Questo ti permette di farlo partire manualmente premendo un bottone su GitHub!

jobs:
  avvia_bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del codice
      uses: actions/checkout@v4

    - name: Setup di Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Installa le librerie necessarie
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 PyPDF2

    - name: Esegui lo script Python
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python bandi.py

    - name: Salva i nuovi bandi nel repository
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action Bot"
        git add bandi_trovati.json
        # Salva le modifiche solo se ci sono nuovi bandi, altrimenti ignora
        git commit -m "Aggiornamento memoria bandi trovati" || echo "Nessun nuovo bando da salvare"
        git push
